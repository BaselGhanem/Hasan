<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دار الدواء - منصة التحليلات 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .tabs-nav { display: flex; gap: 10px; margin: 20px 0; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    .tab-btn { padding: 12px 25px; border: none; background: #f0f0f0; cursor: pointer; font-family: 'Almarai'; font-weight: bold; border-radius: 8px; transition: 0.3s; }
    .tab-btn.active { background: #004a99; color: white; }
    .view-content { display: none; }
    .view-content.active { display: block; animation: fadeIn 0.4s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="light">
  <div class="app-container">
    <header class="header">
      <div class="header-logo">
        <div class="logo-icon">⚕</div>
        <div class="logo-text"><span class="logo-main">دار الدواء</span><span class="logo-sub">Analytics 2026</span></div>
      </div>
      <div class="header-controls">
        <label class="upload-btn" for="excelFile">📂 <span>رفع ملف Excel</span><input type="file" id="excelFile" accept=".xlsx,.xls" hidden /></label>
        <div class="toggle-group">
          <button class="toggle-btn active" id="toggleValue">القيمة</button>
          <button class="toggle-btn" id="toggleQty">الكمية</button>
        </div>
        <button class="icon-btn" id="darkModeBtn">🌙</button>
      </div>
    </header>

    <div class="status-bar" id="statusBar"><span id="statusText">⬆ ارفع ملف البيانات للبدء</span></div>

    <section class="filters-bar">
      <div class="filter-group"><label>الفريق</label><select id="filterTeam"><option value="">جميع الفرق</option></select></div>
      <div class="filter-group"><label>المنطقة</label><select id="filterArea"><option value="">جميع المناطق</option></select></div>
      <div class="filter-group"><label>المندوب</label><select id="filterRep"><option value="">جميع المندوبين</option></select></div>
      <div class="filter-group"><label>الصنف</label><select id="filterItem"><option value="">جميع الأصناف</option></select></div>
      <div class="filter-group"><label>من</label><input type="date" id="dateFrom" value="2026-01-01" /></div>
      <div class="filter-group"><label>إلى</label><input type="date" id="dateTo" value="2026-12-31" /></div>
      <button class="reset-btn" id="resetFilters">↺</button>
    </section>

    <nav class="tabs-nav">
      <button class="tab-btn active" onclick="switchView('sales-view', this)">📊 لوحة المبيعات</button>
      <button class="tab-btn" onclick="switchView('visits-view', this)">🚗 متابعة الزيارات</button>
    </nav>

    <div id="sales-view" class="view-content active">
      <section class="kpi-container">
        <div class="kpi-card"><div class="kpi-label">إجمالي المبيعات</div><div class="kpi-value" id="kpiTotalSales">-</div></div>
        <div class="kpi-card">
          <div class="kpi-label">تحقيق الهدف</div>
          <div class="kpi-value" id="kpiTarget">-</div>
          <div class="kpi-progress"><div class="kpi-progress-bar" id="kpiProgressBar"></div></div>
        </div>
      </section>
      <section class="charts-section">
        <div class="chart-card"><h3>التحليل الشهري</h3><canvas id="salesChart"></canvas></div>
        <div class="chart-card"><h3>مساهمة الفرق</h3><canvas id="teamsChart"></canvas></div>
      </section>
      <div class="insight-card"><h3>رؤى الإدارة</h3><ul class="swot-list" id="swotList"></ul></div>
    </div>

    <div id="visits-view" class="view-content">
      <section class="kpi-container">
        <div class="kpi-card"><div class="kpi-label">إجمالي الزيارات</div><div class="kpi-value" id="kpiTotalVisits">-</div></div>
        <div class="kpi-card"><div class="kpi-label">عدد المناديب</div><div class="kpi-value" id="kpiReps">-</div></div>
      </section>
      <div class="table-card">
        <div class="table-header"><input type="text" id="tableSearch" placeholder="🔍 بحث سريع في الجدول..." class="table-search" /></div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>المندوب</th><th>الفريق</th><th>المنطقة</th><th>التخصص</th><th>الزيارات</th><th>المبيعات</th><th>الأداء</th></tr></thead>
            <tbody id="visitsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchView(id, btn) {
      document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }
  </script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
